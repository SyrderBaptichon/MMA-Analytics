spring:
  application:
    name: MMA Analytics
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  cache:
    type: caffeine
    cache-names: fighters, events
    caffeine:
      spec: maximumSize=10000,expireAfterWrite=60s
server:
  port: ${SERVER_PORT:8080}
