version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: mma-db
    environment:
      POSTGRES_DB: mma
      POSTGRES_USER: mma
      POSTGRES_PASSWORD: mma
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mma -d mma"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: mma-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/mma
      SPRING_DATASOURCE_USERNAME: mma
      SPRING_DATASOURCE_PASSWORD: mma
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: mma-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  db_data:


